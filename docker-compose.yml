version: '3.8'
services:
  db:
    image: postgres:15
    container_name: resource_booking_db
    environment:
      POSTGRES_DB: resource_booking
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
